services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pc_builder}
      POSTGRES_USER: ${POSTGRES_USER:-pc_builder}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pc_builder}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pc_builder} -d ${POSTGRES_DB:-pc_builder}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:

