services:
  - type: web
    name: pc-builder-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: frankfurt
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: DATABASE_HOST
        fromDatabase:
          name: pc-builder-db
          property: host
      - key: DATABASE_PORT
        fromDatabase:
          name: pc-builder-db
          property: port
      - key: DATABASE_NAME
        fromDatabase:
          name: pc-builder-db
          property: database
      - key: DATABASE_USERNAME
        fromDatabase:
          name: pc-builder-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: pc-builder-db
          property: password
      - key: JWT_SECRET
        sync: false
      - key: APP_ALLOWED_ORIGIN
        sync: false
      - key: APP_COOKIE_SECURE
        value: "true"
      - key: APP_COOKIE_SAME_SITE
        value: None
      - key: SPRING_PROFILES_ACTIVE
        value: prod

  - type: web
    name: pc-builder-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: pc-builder-db
    databaseName: pc_builder
    user: pc_builder
    region: frankfurt
    plan: free
